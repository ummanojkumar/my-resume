<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U M Manoj Kumar | Portfolio</title>
    
    <!-- External Dependencies (Loaded from CDN for single-file portability) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/framer-motion@10.12.16/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@0.463.0/dist/umd/lucide.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
            background-color: #020617; /* slate-950 */
            color: #e2e8f0; /* slate-200 */
            overflow-x: hidden;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950">
    <div id="root">
        <!-- Temporary loading state while dependencies initialize -->
        <div style="display: flex; height: 100vh; align-items: center; justify-content: center; background: #020617; color: #38bdf8; font-family: sans-serif;">
            <div style="text-align: center;">
                <div style="font-size: 24px; font-weight: bold; margin-bottom: 10px;">M</div>
                <p>Initializing Portfolio...</p>
            </div>
        </div>
    </div>

    <script type="text/babel">
        /**
         * PORTFOLIO CONFIGURATION & DATA
         */
        const USER_INFO = {
            name: "U M Manoj Kumar",
            title: "Java Backend Developer II",
            email: "ummanojkumar925@gmail.com",
            phone: "+91 9133296929",
            location: "Hindupur, Andhra Pradesh",
            socials: {
                linkedin: "https://linkedin.com/in/ummanojkumar",
                github: "https://github.com/ummanojkumar",
                blog: "https://ummanojkumar.blogspot.com",
                whatsapp: "https://wa.me/919133296929",
                instagram: "https://instagram.com/um_manoj_kumar",
                facebook: "https://facebook.com/ummanojkumar"
            }
        };

        const EXPERIENCES = [
            {
                company: "Aditi Consulting",
                role: "Java Backend Developer II",
                period: "Oct 2024 - Present",
                location: "Chennai, India",
                client: "PayPal",
                description: "Developing Spring Boot microservices for product configuration data, integrating with Google BigQuery, and building dynamic frontends with React & Next.js."
            },
            {
                company: "Wipro",
                role: "Software Engineer",
                period: "Oct 2021 - Oct 2024",
                location: "Chennai, India",
                client: "DBS Bank",
                description: "Built scalable RESTful microservices for credit card installment payments and insurance protection plans. Migrated monolithic legacy systems to Hexagonal Architecture."
            }
        ];

        const PROJECTS = [
            {
                title: "Product Configuration Service",
                subtitle: "PayPal Project",
                description: "CRUD operations for complex datasets. Integrated Google BigQuery. Implemented RBAC and approval workflows with high-performance React Hook Form & Zod frontends.",
                tech: ["Java", "Spring Boot", "BigQuery", "React.js", "Next.js", "Harness"]
            },
            {
                title: "Credit Card Pay by Installment",
                subtitle: "DBS Project",
                description: "Flexible finance management tool allowing users to convert transactions into installments. Reduced immediate financial burden for millions of card users.",
                tech: ["Java", "Spring Boot", "Hexagonal Architecture", "MariaDB", "Spring Cache"]
            },
            {
                title: "Card & Cash Care Insurance",
                subtitle: "DBS Project",
                description: "Protective coverage for outstanding balances. Automated claim submission and activation logic for accidents and unforeseen events.",
                tech: ["Spring Data JPA", "MariaDB", "Microservices", "TDD", "PCF"]
            }
        ];

        /**
         * REUSABLE COMPONENTS & LOGIC
         */
        const { useState, useEffect, createElement } = React;
        const Motion = window.Motion || window.FramerMotion;
        const { motion, AnimatePresence } = Motion;

        // Custom Icon Component (Using core Lucide for maximum reliability)
        const Icon = ({ name, size = 24, className = "" }) => {
            // Find icon in lucide global object (supports various casing)
            const iconData = window.lucide?.icons[name] || 
                           window.lucide?.icons[name.charAt(0).toLowerCase() + name.slice(1)] ||
                           window.lucide?.icons[name.toLowerCase()];
            if (!iconData) return null;
            
            // iconData format: [tag, attrs, children]
            const renderNode = (node, index) => {
                if (typeof node === 'string') return node;
                const [tag, attrs, children] = node;
                return createElement(tag, { 
                    ...attrs, 
                    key: `${tag}-${index}-${Math.random()}` 
                }, (children || []).map((c, i) => renderNode(c, i)));
            };

            return createElement('svg', {
                xmlns: "http://www.w3.org/2000/svg",
                width: size,
                height: size,
                viewBox: "0 0 24 24",
                fill: "none",
                stroke: "currentColor",
                strokeWidth: "2",
                strokeLinecap: "round",
                strokeLinejoin: "round",
                className: `lucide lucide-${name.toLowerCase()} ${className}`
            }, (iconData[2] || []).map((c, i) => renderNode(c, i)));
        };

        const App = () => {
            const [activeSection, setActiveSection] = useState('home');
            const [isMenuOpen, setIsMenuOpen] = useState(false);

            useEffect(() => {
                const handleScroll = () => {
                    const sections = ['home', 'experience', 'projects', 'skills', 'contact'];
                    const scrollPosition = window.scrollY + 200;

                    for (const section of sections) {
                        const element = document.getElementById(section);
                        if (element && scrollPosition >= element.offsetTop) {
                            setActiveSection(section);
                        }
                    }
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div className="relative min-h-screen">
                    {/* Background Decor */}
                    <div className="fixed inset-0 -z-10 bg-slate-950 overflow-hidden">
                        <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-sky-900/20 rounded-full blur-[120px]"></div>
                        <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-indigo-900/20 rounded-full blur-[120px]"></div>
                    </div>

                    {/* Navbar */}
                    <nav className="fixed top-0 w-full z-50 bg-slate-950/80 backdrop-blur-md border-b border-slate-800">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-16">
                                <div className="flex-shrink-0 flex items-center gap-2">
                                    <div className="w-10 h-10 bg-gradient-to-br from-sky-400 to-indigo-600 rounded-lg flex items-center justify-center font-bold text-white text-xl">
                                        M
                                    </div>
                                    <span className="hidden sm:block text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">
                                        Manoj Kumar
                                    </span>
                                </div>
                                
                                <div className="hidden md:block">
                                    <div className="ml-10 flex items-baseline space-x-4">
                                        {['home', 'experience', 'projects', 'contact'].map((item) => (
                                            <a key={item} href={`#${item}`} className={`px-3 py-2 rounded-md text-sm font-medium capitalize transition-all duration-300 ${activeSection === item ? 'text-sky-400 bg-sky-400/10' : 'text-slate-300 hover:text-white hover:bg-slate-800'}`}>
                                                {item}
                                            </a>
                                        ))}
                                    </div>
                                </div>

                                <div className="md:hidden">
                                    <button onClick={() => setIsMenuOpen(!isMenuOpen)} className="p-2 text-slate-400 hover:text-white">
                                        {isMenuOpen ? <Icon name="X" size={24} /> : <Icon name="Menu" size={24} />}
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Mobile menu */}
                        <AnimatePresence>
                            {isMenuOpen && (
                                <motion.div 
                                    initial={{ opacity: 0, height: 0 }}
                                    animate={{ opacity: 1, height: 'auto' }}
                                    exit={{ opacity: 0, height: 0 }}
                                    className="md:hidden bg-slate-900 border-b border-slate-800"
                                >
                                    <div className="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                                        {['home', 'experience', 'projects', 'contact'].map((item) => (
                                            <a key={item} href={`#${item}`} onClick={() => setIsMenuOpen(false)} className="block px-3 py-2 rounded-md text-base font-medium text-slate-300 hover:text-white hover:bg-slate-800 capitalize">
                                                {item}
                                            </a>
                                        ))}
                                    </div>
                                </motion.div>
                            )}
                        </AnimatePresence>
                    </nav>

                    <main className="pt-16">
                        {/* Hero Section */}
                        <section id="home" className="min-h-screen flex items-center relative py-20 px-4 sm:px-6 lg:px-8">
                            <div className="max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
                                <motion.div initial={{ opacity: 0, x: -50 }} animate={{ opacity: 1, x: 0 }} transition={{ duration: 0.8 }} className="space-y-6">
                                    <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-sky-500/10 border border-sky-500/20 text-sky-400 text-sm font-medium">
                                        <span className="relative flex h-2 w-2">
                                            <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-sky-400 opacity-75"></span>
                                            <span className="relative inline-flex rounded-full h-2 w-2 bg-sky-500"></span>
                                        </span>
                                        Available for New Opportunities
                                    </div>
                                    <h1 className="text-5xl lg:text-7xl font-extrabold tracking-tight">
                                        Backend <span className="text-sky-400">Architect.</span><br />
                                        Full Stack <span className="bg-clip-text text-transparent bg-gradient-to-r from-sky-400 to-indigo-500">Visionary.</span>
                                    </h1>
                                    <p className="text-lg text-slate-400 max-w-lg leading-relaxed">
                                        I'm <span className="text-white font-semibold">U M Manoj Kumar</span>, a Senior Java Backend Developer at PayPal (via Aditi) with 4+ years of experience building mission-critical fintech systems.
                                    </p>
                                    <div className="flex flex-wrap gap-4 pt-4">
                                        <a href="#contact" className="px-8 py-3 bg-sky-500 hover:bg-sky-600 text-white rounded-full font-bold transition-all flex items-center gap-2 shadow-lg shadow-sky-500/25">
                                            Hire Me <Icon name="ChevronRight" size={18} />
                                        </a>
                                        <div className="flex items-center gap-4">
                                            <a href={USER_INFO.socials.github} target="_blank" className="p-3 bg-slate-800 hover:bg-slate-700 rounded-full text-slate-400 hover:text-white transition-all"><Icon name="Github" size={20} /></a>
                                            <a href={USER_INFO.socials.linkedin} target="_blank" className="p-3 bg-slate-800 hover:bg-slate-700 rounded-full text-slate-400 hover:text-white transition-all"><Icon name="Linkedin" size={20} /></a>
                                            <a href={USER_INFO.socials.whatsapp} target="_blank" className="p-3 bg-slate-800 hover:bg-slate-700 rounded-full text-slate-400 hover:text-white transition-all"><Icon name="MessageCircle" size={20} /></a>
                                        </div>
                                    </div>
                                </motion.div>

                                <motion.div initial={{ opacity: 0, scale: 0.8 }} animate={{ opacity: 1, scale: 1 }} transition={{ duration: 1 }} className="relative flex justify-center lg:justify-end">
                                    <div className="relative w-72 h-72 lg:w-96 lg:h-96">
                                        <div className="absolute inset-0 bg-gradient-to-br from-sky-500 to-indigo-600 rounded-3xl rotate-6 opacity-20 blur-2xl"></div>
                                        <div className="relative z-10 w-full h-full bg-slate-800 border-2 border-slate-700 rounded-3xl overflow-hidden shadow-2xl">
                                            <img src="https://picsum.photos/seed/manoj/600/600" alt="Manoj" className="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-500" />
                                            <div className="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-slate-950 to-transparent">
                                                <p className="text-xs font-mono text-sky-400 mb-1">&gt; Current_Role</p>
                                                <p className="text-white font-bold">Java Backend Developer II @ PayPal</p>
                                            </div>
                                        </div>
                                    </div>
                                </motion.div>
                            </div>
                        </section>

                        {/* Experience */}
                        <section id="experience" className="py-24 px-4 sm:px-6 lg:px-8 relative">
                            <div className="max-w-7xl mx-auto">
                                <h3 className="text-4xl font-bold mb-12">Work Experience</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    {EXPERIENCES.map((exp, idx) => (
                                        <motion.div key={idx} initial={{ opacity: 0, y: 30 }} whileInView={{ opacity: 1, y: 0 }} transition={{ duration: 0.5, delay: idx * 0.2 }} className="bg-slate-900 border border-slate-800 p-8 rounded-3xl hover:border-sky-500/50 transition-all">
                                            <p className="text-sky-400 font-bold mb-2">{exp.period}</p>
                                            <h4 className="text-2xl font-bold text-white mb-1">{exp.role}</h4>
                                            <p className="text-slate-400 font-semibold mb-4">{exp.company} • {exp.location}</p>
                                            <p className="text-slate-500 leading-relaxed italic">{exp.description}</p>
                                        </motion.div>
                                    ))}
                                </div>
                            </div>
                        </section>

                        {/* Projects */}
                        <section id="projects" className="py-24 px-4 sm:px-6 lg:px-8">
                            <div className="max-w-7xl mx-auto">
                                <h3 className="text-4xl font-bold mb-12">Featured Projects</h3>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                    {PROJECTS.map((project, idx) => (
                                        <motion.div key={idx} initial={{ opacity: 0, y: 20 }} whileInView={{ opacity: 1, y: 0 }} transition={{ duration: 0.5, delay: idx * 0.1 }} className="bg-slate-900 border border-slate-800 rounded-3xl p-8 hover:border-sky-500/30 transition-all">
                                            <span className="text-sky-400 font-mono text-xs uppercase mb-2 block">{project.subtitle}</span>
                                            <h4 className="text-2xl font-bold mb-3">{project.title}</h4>
                                            <p className="text-slate-400 text-sm mb-6 leading-relaxed">"{project.description}"</p>
                                            <div className="flex flex-wrap gap-2">
                                                {project.tech.map((t, i) => (
                                                    <span key={i} className="px-2 py-1 bg-slate-800 text-slate-400 rounded text-[10px] font-mono border border-slate-700">{t}</span>
                                                ))}
                                            </div>
                                        </motion.div>
                                    ))}
                                </div>
                            </div>
                        </section>

                        {/* Contact */}
                        <section id="contact" className="py-24 px-4 sm:px-6 lg:px-8 bg-slate-900/50">
                            <div className="max-w-7xl mx-auto text-center">
                                <h3 className="text-4xl font-bold mb-6">Let's Build Something Epic.</h3>
                                <div className="flex flex-col md:flex-row justify-center gap-8 mt-12">
                                    <a href={`mailto:${USER_INFO.email}`} className="flex items-center gap-4 p-6 bg-slate-900 border border-slate-800 rounded-2xl hover:border-sky-500 transition-all">
                                        <Icon name="Mail" size={24} className="text-sky-400" />
                                        <span className="font-bold">{USER_INFO.email}</span>
                                    </a>
                                    <a href={`tel:${USER_INFO.phone}`} className="flex items-center gap-4 p-6 bg-slate-900 border border-slate-800 rounded-2xl hover:border-indigo-500 transition-all">
                                        <Icon name="Phone" size={24} className="text-indigo-400" />
                                        <span className="font-bold">{USER_INFO.phone}</span>
                                    </a>
                                </div>
                            </div>
                        </section>
                    </main>

                    <footer className="py-12 border-t border-slate-900 text-center">
                        <p className="text-slate-500 text-sm">© 2024 Manoj Kumar. Built with React & Lucide Core.</p>
                    </footer>
                </div>
            );
        };

        // Render Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(createElement(App));
    </script>
</body>
</html>
